<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Browser Bridge</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        color: #111827;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 520px;
        margin: 24px;
        padding: 32px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      #extension-version {
        margin: 0 0 20px;
        color: #6b7280;
        font-size: 13px;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        font-weight: 600;
      }
      #status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #9ca3af;
        flex: none;
      }
      #status[data-connected="true"] #status-dot {
        background: #16a34a;
      }
      #status[data-connected="false"] #status-dot {
        background: #dc2626;
      }
      #port-text {
        margin: 16px 0 0;
        font-size: 14px;
        color: #374151;
      }
      #port-text code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
      }
      #guidance-text {
        margin: 16px 0 0;
        font-size: 14px;
        line-height: 1.7;
        color: #374151;
      }
      #permission-text,
      #error-text {
        margin: 12px 0 0;
        font-size: 13px;
        line-height: 1.6;
      }
      #permission-text {
        color: #4b5563;
      }
      #error-text {
        color: #b91c1c;
      }
      #action-button {
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      #action-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="extension-name">Agent Browser Bridge</h1>
      <p id="extension-version"></p>
      <div id="status" data-connected="unknown" role="status" aria-live="polite">
        <span id="status-dot" aria-hidden="true"></span>
        <span id="status-text">Checking connection…</span>
      </div>
      <p id="port-text"></p>
      <p id="permission-text" role="status" aria-live="polite"></p>
      <p id="error-text" role="alert" hidden></p>
      <button id="action-button" type="button" hidden></button>
      <p id="guidance-text"></p>
    </main>
    <script type="module" src="./onboarding/main.ts"></script>
  </body>
</html>
